<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tower of Hanoi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif; color: #fff;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95 50%, #0f766e);
  }
  h1 { margin: 0 0 6px; font-size: 38px; letter-spacing: 2px; }
  #info {
    margin-bottom: 18px; padding: 6px 18px; border-radius: 20px;
    background: rgba(255,255,255,0.15); font-size: 15px;
  }
  #board {
    display: flex; gap: 20px; padding: 30px 30px 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px; backdrop-filter: blur(6px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .peg {
    position: relative; width: 230px; height: 250px;
    display: flex; flex-direction: column-reverse; align-items: center;
    border-bottom: 12px solid #f5c26b; border-radius: 0 0 8px 8px;
  }
  .peg::before {
    content: ""; position: absolute; bottom: 0; width: 10px; height: 100%;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(90deg, #fde68a, #f5c26b);
    box-shadow: 0 0 12px rgba(245,194,107,0.6);
  }
  .label { margin-top: 8px; font-size: 13px; opacity: .7; }
  .disk {
    height: 24px; margin-top: 3px; border-radius: 12px; position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.45);
    animation: drop .25s ease-out;
  }
  @keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  #buttons { margin-top: 26px; }
  button {
    font-size: 16px; padding: 10px 24px; margin: 4px; border: none; border-radius: 25px;
    color: #fff; cursor: pointer; font-weight: 600;
    background: linear-gradient(135deg, #f472b6, #8b5cf6);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3); transition: transform .15s;
  }
  button:hover { transform: translateY(-2px) scale(1.05); }
  button.alt { background: linear-gradient(135deg, #38bdf8, #14b8a6); }
  button.gray { background: linear-gradient(135deg, #64748b, #475569); }
</style>
</head>
<body>
  <h1>Tower of Hanoi</h1>
  <div id="info"></div>
  <div id="board">
    <div><div class="peg" id="peg0"></div><div class="label">Peg 1</div></div>
    <div><div class="peg" id="peg1"></div><div class="label">Peg 2</div></div>
    <div><div class="peg" id="peg2"></div><div class="label">Peg 3</div></div>
  </div>
  <div id="buttons">
    <button onclick="play()">&#9654; Play</button>
    <button class="alt" onclick="stepOnce()">Step</button>
    <button class="gray" onclick="resetAll()">Reset</button>
  </div>

  <!-- moves.js is created by Prolog -->
  <script src="moves.js"></script>
  <script>
    let pegs, step, timer;
    const COLORS = ["#f43f5e", "#f97316", "#facc15", "#22c55e", "#06b6d4", "#3b82f6", "#a855f7", "#ec4899"];

    function resetAll() {
      clearInterval(timer);
      pegs = [[], [], []];
      for (let d = DISKS; d >= 1; d--) pegs[0].push(d); // biggest at the bottom
      step = 0;
      draw();
    }

    function draw() {
      for (let i = 0; i < 3; i++) {
        const peg = document.getElementById("peg" + i);
        peg.innerHTML = "";
        for (const size of pegs[i]) {
          const disk = document.createElement("div");
          disk.className = "disk";
          disk.style.width = (50 + size * 22) + "px";
          disk.style.background = COLORS[(size - 1) % COLORS.length];
          peg.appendChild(disk);
        }
      }
      document.getElementById("info").textContent =
        DISKS + " disks  |  Move " + step + " of " + MOVES.length;
    }

    function stepOnce() {
      if (step >= MOVES.length) return false;
      const [from, to] = MOVES[step];
      step++;
      pegs[to - 1].push(pegs[from - 1].pop());
      draw();
      return true;
    }

    function play() {
      clearInterval(timer);
      timer = setInterval(() => { if (!stepOnce()) clearInterval(timer); }, 600);
    }

    if (typeof DISKS === "undefined") {
      document.getElementById("info").textContent =
        "moves.js not found. Run ?- run(3). in Prolog first.";
    } else {
      resetAll();
    }
  </script>
</body>
</html>
